<table class="table table-striped">
  <thead>
    <tr>
      <th>Australian research institution</th>
      <th>Email domains</th>
    </tr>
  </thead>

  <tbody>
    {% for institution in institutions %}
    <tr>
      <td>{{ institution.name }}</td>
      <td>
        {% for domain in institution.domains %}
        <span class="badge bg-light text-dark border fw-normal my-1" style="font-size: 0.9rem;">{% if domain|slice:":1" != "*" %}@{% endif %}{{ domain }}</span>
        {% endfor %}
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
